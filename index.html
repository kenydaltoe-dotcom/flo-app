<!doctype html><html lang="pt-BR"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#f7f8f5"><title>Flo — Seu dinheiro, mais leve</title><style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif;color:#22302a;background:#f7f8f5}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.4;cursor:not-allowed}.shell{display:flex;min-height:100vh}.sidebar{width:236px;padding:30px 16px;border-right:1px solid #e6eae5;background:#fff;position:sticky;top:0;height:100vh}.brand{font-size:35px;letter-spacing:-3px;font-weight:800;margin:0 0 2px 14px;color:#27654c}.tagline{font-size:12px;color:#89958e;margin:0 0 36px 15px}.nav{width:100%;text-align:left;border:0;background:transparent;border-radius:13px;padding:13px 15px;margin-bottom:5px;color:#607067}.nav.active{background:#eaf4ed;color:#205b42;font-weight:700}.main{width:min(1080px,100%);margin:auto;padding:34px 42px 100px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;gap:12px}h1{font-size:27px;letter-spacing:-.9px;margin:0}h2{font-size:18px;margin:0 0 14px;letter-spacing:-.3px}p{color:#849087}.muted{font-size:13px;color:#89958e}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:#fff;border:1px solid #e9eee9;border-radius:19px;padding:20px;box-shadow:0 3px 14px #22302a06}.card.big{grid-column:span 2}.card .value{font-size:25px;font-weight:750;letter-spacing:-.7px;margin-top:10px;overflow-wrap:anywhere}.card .label{color:#7d8c83;font-size:13px}.green{color:#287858}.red{color:#ba514b}.row{display:flex;justify-content:space-between;align-items:center;gap:14px}.section{margin-top:26px}.list{display:flex;flex-direction:column;gap:9px}.item{padding:13px 0;border-bottom:1px solid #eef0ee;display:flex;align-items:center;justify-content:space-between;gap:12px}.item:last-child{border-bottom:0}.item strong{font-size:14px}.item small{display:block;color:#95a099;margin-top:4px}.btn{background:#2c7555;color:white;border:0;border-radius:12px;padding:11px 17px;font-weight:650}.btn.secondary{background:#e9f2eb;color:#2a6a4e}.btn.ghost{background:transparent;color:#65776b;padding:7px}.btn.danger{color:#b54c46;background:#fff0ee}.progress{height:9px;border-radius:20px;background:#edf0eb;overflow:hidden;margin:14px 0}.progress>div{height:100%;background:#4e9b70;border-radius:20px;transition:width .2s}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.form{display:grid;gap:12px}.form label{font-size:12px;font-weight:650;color:#66766c;display:grid;gap:6px}.form input,.form select,.month{width:100%;padding:12px;border:1px solid #e0e8e0;border-radius:11px;background:#fff;color:#26382e;outline-color:#4e9b70}.month{width:auto}.pill{font-size:12px;padding:6px 10px;border-radius:30px;background:#edf4ee;color:#377657;white-space:nowrap}.pill.pending{background:#fff2e8;color:#a46d34}.actions{display:flex;gap:7px;align-items:center;flex-wrap:wrap}.empty{padding:20px;color:#9ba79f;text-align:center}.mobilebar{display:none}.modal-backdrop{position:fixed;inset:0;background:#1b2d236b;display:flex;justify-content:center;align-items:center;padding:16px;z-index:10}.modal{background:white;border-radius:20px;padding:24px;width:min(460px,100%);max-height:90vh;overflow:auto}.modal h2{margin-bottom:18px}.note{background:#f1f6f0;padding:14px;border-radius:13px;font-size:13px;color:#64806b}.split{display:grid;grid-template-columns:1.2fr 1fr;gap:16px}.smallbtn{font-size:12px;padding:7px 10px}.footer{margin-top:30px;font-size:12px;color:#a1aaa3}.chartrow{display:flex;gap:12px;align-items:center;margin:10px 0;font-size:13px}.chartrow span:first-child{width:90px}.chartbar{height:12px;border-radius:10px;background:#4e9b70;min-width:2px}.chartbar.out{background:#e0aa7b}.chartbar.inv{background:#8c9bdf}@media(max-width:900px){.sidebar{display:none}.main{padding:22px 16px 110px}.cards{grid-template-columns:repeat(2,1fr)}.mobilebar{position:fixed;bottom:0;left:0;right:0;display:flex;overflow-x:auto;background:#fff;border-top:1px solid #e9eee9;z-index:3;padding:7px 5px env(safe-area-inset-bottom);justify-content:space-around}.mobilebar button{border:0;background:transparent;color:#76857b;font-size:11px;min-width:57px;padding:7px 3px}.mobilebar button.active{color:#287858;font-weight:750}.mobilebar button span{display:block;font-size:20px;margin-bottom:2px}}@media(max-width:600px){.cards,.grid2,.split{grid-template-columns:1fr 1fr}.card.big{grid-column:span 2}.split{grid-template-columns:1fr}.card{padding:16px}.card .value{font-size:22px}.top{align-items:flex-start}h1{font-size:23px}}
</style></head><body><div id="app"></div><script>
const KEY='flo-v1';const defaults=()=>({incomes:[],bills:[],leisure:[],investments:[],budgets:{},settings:{cdi:12}});let db;try{db=Object.assign(defaults(),JSON.parse(localStorage.getItem(KEY)||'{}'))}catch{db=defaults()}let tab='inicio',month=new Date().toISOString().slice(0,7),modal='',editing=null;const tabs=[['inicio','🏠','Início'],['lazer','🎉','Lazer'],['recebimentos','💰','Recebimentos'],['contas','🧾','Contas'],['investimentos','📈','Investimentos'],['relatorios','📊','Relatórios']];const $=s=>document.querySelector(s),save=()=>localStorage.setItem(KEY,JSON.stringify(db)),id=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random(),n=x=>Math.max(0,Number(x)||0),sum=(a,f=x=>x.value)=>a.reduce((t,x)=>t+n(f(x)),0),br=x=>n(x).toLocaleString('pt-BR',{style:'currency',currency:'BRL'}),signed=x=>(x<0?'- ':'')+br(Math.abs(x)),fmt=m=>new Date(m+'-02T12:00:00').toLocaleDateString('pt-BR',{month:'long',year:'numeric'}),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),inMonth=(d,m=month)=>String(d||'').slice(0,7)===m,ym=(m,delta)=>{let [y,mo]=m.split('-').map(Number);return new Date(y,mo-1+delta,1).toISOString().slice(0,7)},monthDay=(m,day)=>`${m}-${String(Math.min(Number(day),new Date(Number(m.slice(0,4)),Number(m.slice(5,7)),0).getDate())).padStart(2,'0')}`;
function installments(b){return Array.from({length:n(b.parts)||1},(_,i)=>({key:b.id+'-'+i,index:i+1,total:n(b.parts)||1,name:b.name,value:n(b.value),date:monthDay(ym(b.start,i),b.day),paid:!!(b.paid||{})[i],billId:b.id,category:b.category||'Outros'}))}function due(m=month){return db.bills.flatMap(installments).filter(x=>inMonth(x.date,m))}function income(m=month){return sum(db.incomes.filter(x=>inMonth(x.date,m)))}function leisure(m=month){return sum(db.leisure.filter(x=>inMonth(x.date,m)))}function invested(m=month){return sum(db.investments.filter(x=>inMonth(x.date,m)),x=>x.type==='withdraw'?-x.value:x.value)}function committed(m=month){return sum(due(m))}function budget(m=month){return n(db.budgets[m])}function free(m=month){return income(m)-committed(m)-budget(m)-invested(m)}function card(label,value,cls='',big=false){return `<div class="card ${big?'big':''}"><div class="label">${label}</div><div class="value ${cls}">${value}</div></div>`}function btn(label,fn,cls='secondary smallbtn'){return `<button class="btn ${cls}" onclick="${fn}">${label}</button>`}function item(name,detail,amount,actions=''){return `<div class="item"><div><strong>${esc(name)}</strong><small>${esc(detail)}</small></div><div class="actions"><strong>${amount}</strong>${actions}</div></div>`}function empty(msg){return `<div class="empty">${msg}</div>`}
function home(){let bills=due(),paid=bills.filter(x=>x.paid).length,remaining=budget()-leisure();return `<div class="cards">${card('💵 Recebimentos',br(income()))}${card('🧾 Compromissos do mês',br(committed()))}${card('🎉 Lazer restante',signed(remaining),remaining<0?'red':'green')}${card('📈 Aportes líquidos',signed(invested()),invested()<0?'red':'green')}${card('💚 Livre após reservas',signed(free()),free()<0?'red':'green',true)}${card('📌 Parcelas pendentes',String(bills.length-paid), '',true)}</div><div class="split section"><div class="card"><div class="row"><h2>Contas do mês</h2><span class="pill">${paid}/${bills.length} pagas</span></div><div class="progress"><div style="width:${bills.length?100*paid/bills.length:0}%"></div></div>${bills.length&&paid===bills.length?'<div class="note">✨ Tudo pago! Continue mantendo suas finanças em dia.</div>':bills.length?'<p class="muted">Cada conta paga é mais um passo para um mês tranquilo.</p>':'<p class="muted">Cadastre suas contas para acompanhar o mês.</p>'}<div class="list">${bills.slice(0,5).map(x=>item(x.name,`${x.index}/${x.total} • ${x.date}`,br(x.value),btn(x.paid?'✓ Pago':'Marcar pago',`togglePaid('${x.billId}',${x.index-1})`,x.paid?'secondary smallbtn':'smallbtn'))).join('')}</div></div><div class="card"><h2>Seu lazer</h2><div class="label">Ainda disponível</div><div class="value ${remaining<0?'red':'green'}">${signed(remaining)}</div><div class="progress"><div style="width:${budget()?Math.min(100,100*leisure()/budget()):0}%"></div></div><p class="muted">${br(leisure())} gastos de ${br(budget())} reservados.</p>${btn('Registrar gasto',"openModal('leisure')",'')}</div></div><div class="section card"><div class="row"><div><h2>Seu mês em uma frase</h2><div class="muted">Organização sem complicação.</div></div><span style="font-size:28px">🌿</span></div><p>${free()>=0?'Seu planejamento está dentro do que entrou neste mês. Continue registrando seus movimentos.':'Seus compromissos e reservas ultrapassam os recebimentos registrados. Revise suas metas ou cadastre receitas que ainda não lançou.'}</p></div>`}
function leisurePage(){let rest=budget()-leisure();return `<div class="cards">${card('🎯 Meta de lazer',br(budget()))}${card('🛍️ Gastos registrados',br(leisure()))}${card('💚 Ainda disponível',signed(rest),rest<0?'red':'green',true)}</div><div class="grid2 section"><div class="card"><h2>Seu limite do mês</h2><div class="form"><label>Quanto deseja reservar para lazer?<input id="budget" type="number" min="0" step="0.01" value="${budget()}"></label>${btn('Salvar limite', 'setBudget()', '')}</div><div class="progress"><div style="width:${budget()?Math.min(100,100*leisure()/budget()):0}%"></div></div><p class="muted">O valor reservado já é considerado no saldo livre do início.</p></div><div class="card"><div class="row"><h2>Gastos de lazer</h2>${btn('+ Novo gasto',"openModal('leisure')",'')}</div><div class="list">${db.leisure.filter(x=>inMonth(x.date)).sort((a,b)=>b.date.localeCompare(a.date)).map(x=>item(x.name,x.date,br(x.value),btn('Excluir',`remove('leisure','${x.id}')`,'ghost smallbtn'))).join('')||empty('Nenhum gasto registrado neste mês.')}</div></div></div>`}
function incomePage(){return `<div class="row"><p>Registre quantas fontes de renda quiser.</p>${btn('+ Recebimento',"openModal('income')",'')}</div><div class="cards">${card('Total recebido no mês',br(income()),'green',true)}${card('Quantidade de entradas',db.incomes.filter(x=>inMonth(x.date)).length,'',true)}</div><div class="card section"><h2>Entradas de ${fmt(month)}</h2><div class="list">${db.incomes.filter(x=>inMonth(x.date)).sort((a,b)=>b.date.localeCompare(a.date)).map(x=>item(x.name,`${x.category} • ${x.date}`,br(x.value),btn('Excluir',`remove('incomes','${x.id}')`,'ghost smallbtn'))).join('')||empty('Comece registrando um recebimento.')}</div></div>`}
function billsPage(){let arr=due();return `<div class="row"><p>Contas fixas, variáveis e dívidas parceladas.</p>${btn('+ Nova conta',"openModal('bill')",'')}</div><div class="cards">${card('Comprometido neste mês',br(committed()),'',true)}${card('Ainda não pago',br(sum(arr.filter(x=>!x.paid))),'',true)}</div><div class="card section"><h2>Vencimentos de ${fmt(month)}</h2><div class="list">${arr.sort((a,b)=>a.date.localeCompare(b.date)).map(x=>item(x.name,`${x.category} • ${x.date} • Parcela ${x.index}/${x.total}`,br(x.value),btn(x.paid?'✓ Pago':'Marcar pago',`togglePaid('${x.billId}',${x.index-1})`,x.paid?'secondary smallbtn':'smallbtn'))).join('')||empty('Nenhuma conta prevista para este mês.')}</div></div><div class="card section"><h2>Todos os contratos e parcelas</h2><div class="list">${db.bills.map(b=>{let parts=installments(b),paid=parts.filter(x=>x.paid).length;return item(b.name,`${paid}/${parts.length} pagas • ${parts[0].date} até ${parts.at(-1).date}`,`${br(b.value)} × ${parts.length}`,btn('Excluir',`remove('bills','${b.id}')`,'ghost smallbtn'))}).join('')||empty('Cadastre uma conta ou um parcelamento.')}</div><p class="muted">Para contas recorrentes sem prazo final, cadastre novas competências conforme necessário nesta versão.</p></div>`}
function investmentsPage(){let capital=db.investments.filter(x=>x.date.slice(0,7)<=month).reduce((s,x)=>s+(x.type==='withdraw'?-n(x.value):n(x.value)),0),rate=n(db.settings.cdi),yieldMonth=Math.max(0,capital)*(Math.pow(1+rate/100,1/12)-1);return `<div class="row"><p>Controle de aportes e retiradas.</p>${btn('+ Movimentação',"openModal('investment')",'')}</div><div class="cards">${card('Patrimônio aportado líquido',signed(capital),capital<0?'red':'green',true)}${card('Aportes líquidos do mês',signed(invested()),'green',true)}</div><div class="grid2 section"><div class="card"><h2>📈 Simulador CDI</h2><div class="form"><label>Taxa anual hipotética do CDI (%)<input type="number" id="cdi" step="0.01" min="0" value="${rate}"></label>${btn('Atualizar taxa', 'setCdi()', '')}</div><div class="label" style="margin-top:20px">Rendimento mensal bruto estimado</div><div class="value green">${br(yieldMonth)}</div><p class="muted">Simulação a 100% do CDI com capital constante, taxa anual hipotética e conversão composta. Não inclui IR, IOF, taxas nem variação diária. Não é rendimento real nem promessa de retorno.</p></div><div class="card"><h2>Histórico de movimentações</h2><div class="list">${db.investments.filter(x=>x.date.slice(0,7)<=month).sort((a,b)=>b.date.localeCompare(a.date)).map(x=>item(x.name,`${x.date} • ${x.type==='withdraw'?'Retirada':'Aporte'}`,`${x.type==='withdraw'?'- ':'+ '}${br(x.value)}`,btn('Excluir',`remove('investments','${x.id}')`,'ghost smallbtn'))).join('')||empty('Nenhuma movimentação cadastrada.')}</div></div></div>`}
function reportsPage(){let months=Array.from({length:6},(_,i)=>ym(month,i-5));let max=Math.max(1,...months.flatMap(m=>[income(m),committed(m),leisure(m)]));return `<div class="card"><h2>Últimos seis meses</h2>${months.map(m=>`<div style="padding:12px 0;border-bottom:1px solid #edf0ed"><strong style="font-size:13px">${fmt(m)}</strong>${[['Entradas',income(m),''],['Contas',committed(m),'out'],['Lazer',leisure(m),'inv']].map(([label,val,cls])=>`<div class="chartrow"><span>${label}</span><div class="chartbar ${cls}" style="width:${Math.max(2,65*val/max)}%"></div><strong>${br(val)}</strong></div>`).join('')}</div>`).join('')}</div><div class="card section"><h2>Detalhamento das parcelas</h2>${db.bills.length?db.bills.map(b=>`<div style="padding:14px 0;border-bottom:1px solid #edf0ed"><strong>${esc(b.name)}</strong><div class="muted">${installments(b).filter(x=>x.paid).length} de ${b.parts} pagas • ${br(b.value)} cada</div>${installments(b).map(x=>`<div class="item"><span class="muted">${x.date} · ${x.index}/${x.total}</span><span class="pill ${x.paid?'':'pending'}">${x.paid?'✓ Pago':'Pendente'} · ${br(x.value)}</span></div>`).join('')}</div>`).join(''):empty('Nenhuma parcela cadastrada.')}</div><div class="section">${btn('Exportar dados (JSON)', 'exportData()','secondary')}${btn('Importar dados (JSON)', "document.getElementById('importFile').click()",'secondary')}<input hidden id="importFile" type="file" accept="application/json" onchange="importData(this)"></div>`}
function openModal(type){modal=type;render()}function closeModal(){modal='';render()}function modalHtml(){if(!modal)return '';let configs={income:['Novo recebimento',`<label>Descrição<input name="name" required placeholder="Ex.: Salário, vendas, gorjetas"></label><label>Categoria<select name="category"><option>Salário</option><option>Segunda renda</option><option>Renda extra</option><option>Bonificação</option><option>13º salário</option><option>Gorjetas</option><option>Presente</option><option>Outros</option></select></label>`],leisure:['Novo gasto de lazer',`<label>Descrição<input name="name" required placeholder="Ex.: Cinema, iFood"></label>`],bill:['Nova conta ou parcelamento',`<label>Nome da conta<input name="name" required placeholder="Ex.: Rodrigo, aluguel, internet"></label><label>Categoria<select name="category"><option>Parcelas</option><option>Moradia</option><option>Serviços</option><option>Cartão</option><option>Transporte</option><option>Outros</option></select></label><label>Número de parcelas<input name="parts" type="number" min="1" max="360" value="1" required></label><label>Dia de vencimento<input name="day" type="number" min="1" max="31" value="10" required></label><label>Mês da primeira parcela<input name="start" type="month" value="${month}" required></label>`],investment:['Movimentação de investimento',`<label>Descrição<input name="name" required placeholder="Ex.: Caixinha, CDB"></label><label>Tipo<select name="type"><option value="deposit">Aporte</option><option value="withdraw">Retirada</option></select></label>`]};let [title,fields]=configs[modal];return `<div class="modal-backdrop" onclick="if(event.target===this)closeModal()"><div class="modal"><div class="row"><h2>${title}</h2>${btn('✕','closeModal()','ghost')}</div><form class="form" onsubmit="submitForm(event)">${fields}<label>Valor ${modal==='bill'?'de cada parcela':'(R$)'}<input name="value" type="number" min="0.01" step="0.01" required placeholder="0,00"></label>${modal!=='bill'?`<label>Data<input name="date" type="date" value="${month===new Date().toISOString().slice(0,7)?new Date().toISOString().slice(0,10):month+'-01'}" required></label>`:''}<button class="btn" type="submit">Salvar</button></form></div></div>`}
function render(){let title=tabs.find(t=>t[0]===tab)[2];$('#app').innerHTML=`<div class="shell"><aside class="sidebar"><div class="brand">flo.</div><div class="tagline">seu dinheiro, mais leve</div>${tabs.map(([key,emoji,name])=>`<button class="nav ${tab===key?'active':''}" onclick="setTab('${key}')">${emoji} &nbsp; ${name}</button>`).join('')}</aside><main class="main"><div class="top"><div><h1>${tab==='inicio'?'Seu dinheiro, com calma 🌿':title}</h1><div class="muted">${tab==='inicio'?'Um passo de cada vez.':fmt(month)}</div></div><input class="month" aria-label="Mês de referência" type="month" value="${month}" onchange="changeMonth(this.value)"></div>${({inicio:home,lazer:leisurePage,recebimentos:incomePage,contas:billsPage,investimentos:investmentsPage,relatorios:reportsPage})[tab]()}<div class="footer">Flo • Seus dados ficam neste navegador. Faça backups periódicos em Relatórios.</div></main><nav class="mobilebar">${tabs.map(([key,emoji,name])=>`<button class="${tab===key?'active':''}" onclick="setTab('${key}')"><span>${emoji}</span>${name}</button>`).join('')}</nav></div>${modalHtml()}`}
function setTab(t){tab=t;render();window.scrollTo(0,0)}function changeMonth(m){if(/^\d{4}-\d{2}$/.test(m)){month=m;render()}}function setBudget(){db.budgets[month]=n($('#budget').value);save();render()}function setCdi(){db.settings.cdi=n($('#cdi').value);save();render()}function togglePaid(bid,i){let b=db.bills.find(x=>x.id===bid);if(!b)return;b.paid=b.paid||{};b.paid[i]=!b.paid[i];save();render()}function remove(type,identifier){if(!confirm('Excluir este registro?'))return;db[type]=db[type].filter(x=>x.id!==identifier);save();render()}
function submitForm(e){e.preventDefault();let f=new FormData(e.target),value=Number(f.get('value'));if(!(value>0))return;let data={id:id(),name:String(f.get('name')||'').trim(),value};if(!data.name)return;if(modal==='bill'){let parts=Number(f.get('parts')),day=Number(f.get('day'));if(!Number.isInteger(parts)||parts<1||parts>360||!Number.isInteger(day)||day<1||day>31)return;Object.assign(data,{category:f.get('category'),parts,day,start:f.get('start'),paid:{}});db.bills.push(data)}else{data.date=f.get('date');if(modal==='income'){data.category=f.get('category');db.incomes.push(data)}if(modal==='leisure')db.leisure.push(data);if(modal==='investment'){data.type=f.get('type');db.investments.push(data)}}save();modal='';render()}
function exportData(){let blob=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`flo-backup-${month}.json`;a.click();URL.revokeObjectURL(a.href)}function importData(input){let f=input.files[0];if(!f)return;let reader=new FileReader();reader.onload=()=>{try{let x=JSON.parse(reader.result);if(!['incomes','bills','leisure','investments'].every(k=>Array.isArray(x[k]))||typeof x.budgets!=='object'||!x.budgets)throw Error();if(!confirm('Substituir todos os dados atuais pelo backup?'))return;db=Object.assign(defaults(),x);save();render()}catch{alert('Arquivo de backup inválido.')}};reader.readAsText(f)}render();
</script></body></html>
